[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-ego-network-analysis"
version = "1.0.0"
description = "Reproducible graph analysis of social similarity, cohesion, and brokerage in Facebook ego-networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pablo Alejandro Reyes Granados"}]
keywords = ["network-science", "social-networks", "dataops", "dvc", "facebook", "graph-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "networkx>=3.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "matplotlib>=3.6",
  "seaborn>=0.13",
  "psutil>=5.9",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["dvc>=3.50,<4", "pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
facebook-graph-analysis = "project_cli:main"

[tool.setuptools]
py-modules = ["project_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --capture=no"
markers = [
  "integration: validates generated project artifacts and may require local data",
]

[tool.coverage.run]
source = ["project_cli", "quality_checks"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "data_processed", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741"]
